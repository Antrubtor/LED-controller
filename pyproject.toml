[project]
name = "led-controller"
version = "2.0.0"
description = "Control BanlanX Bluetooth LED controllers (SP611E, SP617E, SP613E…) from your PC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "bleak>=0.22",
    "numpy>=1.26",
    "pyaudiowpatch>=0.2.12 ; sys_platform == 'win32'",
]

[project.scripts]
led-controller = "ledctl.app:main"

[project.gui-scripts]
led-controller-gui = "ledctl.app:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
